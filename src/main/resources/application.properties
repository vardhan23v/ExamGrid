spring.application.name=ExamGrid
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/examgrid_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

examgrid.seed-sample-data=true
examgrid.students-per-invigilator=30
