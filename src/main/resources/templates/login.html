<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="card login-card mx-auto p-4">
        <h3 class="page-title text-center mb-1">Sign in</h3>
        <p class="text-center text-muted small mb-4">Exam Cell, Faculty and Students</p>

        <div class="alert alert-danger py-2" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success py-2" th:if="${param.logout}">You have been logged out.</div>
        <div class="alert alert-warning py-2" th:if="${param.expired}">Your session expired because you logged in elsewhere.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" placeholder="admin / Faculty code / USN" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-navy w-100" type="submit">Login</button>
        </form>
        <hr>
        <p class="small text-muted mb-0">Students and faculty log in with their USN / faculty code. The default password is set by the exam cell.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
