<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Duties')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container-fluid px-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="page-title mb-0">Invigilation Duty Roster</h2>
        <div class="d-flex gap-2">
            <form th:action="@{/admin/duties}" method="get" class="d-flex gap-2">
                <input type="date" name="date" class="form-control" th:value="${date}">
                <button class="btn btn-outline-secondary" type="submit">Filter</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/duties}">All</a>
            </form>
            <a class="btn btn-outline-danger" target="_blank" th:if="${!#lists.isEmpty(duties)}"
               th:href="${date == null} ? @{/admin/reports/duties} : @{/admin/reports/duties(date=${date})}">Download PDF</a>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card p-3">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead><tr><th>Date</th><th>Time</th><th>Hall</th><th>Faculty</th><th>Dept</th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${duties}">
                        <td th:text="${#temporals.format(d.examDate, 'dd-MM-yyyy')}"></td>
                        <td th:text="${d.startTime} + ' - ' + ${d.endTime}"></td>
                        <td th:text="${d.hallName}"></td>
                        <td th:text="${d.facultyName} + ' (' + ${d.facultyCode} + ')'"></td>
                        <td th:text="${d.department}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(duties)}"><td colspan="5" class="text-muted">No duties assigned yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3">
                <h5>Workload balance</h5>
                <table class="table table-sm mb-0">
                    <thead><tr><th>Faculty</th><th class="text-end">Duties</th></tr></thead>
                    <tbody>
                    <tr th:each="entry : ${workload}">
                        <td th:text="${entry.key}"></td>
                        <td class="text-end" th:text="${entry.value}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
