<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container-fluid px-4 py-4">
    <h2 class="page-title mb-4">Exam Cell Dashboard</h2>
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg">
            <div class="card stat-card p-3"><div class="stat-value" th:text="${studentCount}">0</div><div class="stat-label">Students</div></div>
        </div>
        <div class="col-6 col-lg">
            <div class="card stat-card p-3"><div class="stat-value" th:text="${facultyCount}">0</div><div class="stat-label">Faculty</div></div>
        </div>
        <div class="col-6 col-lg">
            <div class="card stat-card p-3"><div class="stat-value" th:text="${hallCount}">0</div><div class="stat-label">Exam Halls</div></div>
        </div>
        <div class="col-6 col-lg">
            <div class="card stat-card p-3"><div class="stat-value" th:text="${totalCapacity}">0</div><div class="stat-label">Total Seats</div></div>
        </div>
        <div class="col-6 col-lg">
            <div class="card stat-card p-3"><div class="stat-value" th:text="${examCount}">0</div><div class="stat-label">Exams</div></div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card p-3 h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Upcoming exam slots</h5>
                    <a class="btn btn-sm btn-navy" th:href="@{/admin/allocation}">Go to allocation</a>
                </div>
                <table class="table table-sm align-middle mb-0">
                    <thead><tr><th>Date</th><th>Time</th><th>Exams</th></tr></thead>
                    <tbody>
                    <tr th:each="slot : ${slots}">
                        <td th:text="${#temporals.format(slot.examDate, 'dd-MM-yyyy')}"></td>
                        <td th:text="${slot.startTime} + ' - ' + ${slot.endTime}"></td>
                        <td><span class="badge bg-light text-dark border me-1" th:each="s : ${slot.subjects}" th:text="${s}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(slots)}"><td colspan="3" class="text-muted">No exams scheduled yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card p-3 h-100">
                <h5 class="mb-2">Invigilation workload</h5>
                <table class="table table-sm mb-0">
                    <thead><tr><th>Faculty</th><th class="text-end">Duties</th></tr></thead>
                    <tbody>
                    <tr th:each="entry : ${workload}">
                        <td th:text="${entry.key}"></td>
                        <td class="text-end" th:text="${entry.value}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
