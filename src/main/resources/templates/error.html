<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="card p-5 text-center mx-auto" style="max-width: 560px;">
        <div class="display-4 fw-bold text-danger" th:text="${status}">500</div>
        <h4 class="mt-2" th:text="${error}">Error</h4>
        <p class="text-muted">The page you requested could not be shown.</p>
        <a class="btn btn-navy" th:href="@{/}">Home</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
